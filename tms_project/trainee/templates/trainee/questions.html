{% extends 'base_dashboard.html' %}

{% block content %}

<style>
.question-card{
    background:#fff;
    border:1px solid #e5e7eb;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}
.question-title{
    font-weight:600;
    margin-bottom:8px;
}
.question-meta{
    font-size:12px;
    color:#6b7280;
}
</style>

<h2>📘 Questions</h2>

{% for q in questions %}
    <div class="question-card">
        <div class="question-title">
            {{ q.text }}
        </div>

        <div class="question-meta">
            {{ q.training.title }} • {{ q.created_at|date:"d M Y" }}
        </div>
    </div>
{% empty %}
    <p>No questions available</p>
{% endfor %}

{% endblock %}
