{% extends "base_dashboard.html" %}

{% block content %}

<style>
.container {
    width: 50%;
    margin: 50px auto;
}

.card {
    background: #fff;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
    color: #374151;
}

input, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
}

input:focus, textarea:focus {
    border-color: #4b5cff;
    outline: none;
}

.btn {
    padding: 12px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
}

.save {
    background: #4b5cff;
    color: #fff;
}

.save:hover {
    background: #3a4bdc;
}

.cancel {
    background: #e5e7eb;
    color: #111827;
    text-decoration: none;
    display: inline-block;
    text-align: center;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

</style>

<div class="container">
    <div class="card">

        <h2>📤 Add Material</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Title -->
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" required>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="4"></textarea>
            </div>

            <!-- File -->
            <div class="form-group">
                <label>Upload File</label>
                <input type="file" name="file" required>
            </div>

            <div class="actions">
                <button type="submit" class="btn save">Save</button>
                <a href="{% url 'material_list' %}" class="btn cancel">Cancel</a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
