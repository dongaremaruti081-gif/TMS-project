<!DOCTYPE html>
<html>
<head>
    <title>Mark Attendance</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f7fb;
            padding: 30px;
        }

        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .status-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .status-btn {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button.submit {
            margin-top: 20px;
            width: 100%;
            background: #4f46e5;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Mark Attendance</h2>

    <form method="POST">
        {% csrf_token %}

        <!-- TRAINEE -->
        <label>Trainee</label>
        <select name="trainee" required>
            <option value="">Select Trainee</option>
            {% for t in trainees %}
                <option value="{{ t.id }}">{{ t.username }}</option>
            {% endfor %}
        </select>

        <!-- DATE -->
        <label>Date</label>
        <input type="date" name="date" required>

        <!-- STATUS -->
        <label>Status</label>
        <select name="status" required>
            <option value="">Select Status</option>
            <option value="present">Present</option>
            <option value="absent">Absent</option>
            <option value="late">Late</option>
        </select>

        <button class="submit" type="submit">Save Attendance</button>
    </form>
</div>

</body>
</html>
