{% extends "base_dashboard.html" %}
{% block content %}

<style>

.container {
    max-width: 600px;
    margin: auto;
}

.card {
    background: #fff;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

.icon {
    text-align: center;
    font-size: 42px;
    margin-bottom: 10px;
}

h2 {
    text-align: center;
    color: #111827;
    margin-bottom: 20px;
}

/* FORM */
.form-group {
    margin-bottom: 15px;
}

label {
    font-weight: 600;
    font-size: 13px;
    color: #374151;
    display: block;
    margin-bottom: 6px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    font-size: 14px;
    outline: none;
}

input:focus, textarea:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79,70,229,0.1);
}

/* FILE BOX */
.file-box {
    border: 2px dashed #c7d2fe;
    background: #f9faff;
    padding: 15px;
    border-radius: 10px;
}

.file-name {
    font-size: 12px;
    color: #6b7280;
    margin-top: 8px;
}

/* BUTTONS */
.actions {
    margin-top: 25px;
    display: flex;
    gap: 10px;
}

.btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    font-weight: 600;
    border: none;
    cursor: pointer;
}

.update {
    background: linear-gradient(90deg,#4f46e5,#3b82f6);
    color: white;
}

.cancel {
    background: #f3f4f6;
    color: #111827;
    text-align: center;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
}

.update:hover {
    opacity: 0.9;
}

.cancel:hover {
    background: #e5e7eb;
}

</style>

<div class="container">

    <div class="card">

        <div class="icon">✏️</div>
        <h2>Edit Material</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- TITLE -->
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" value="{{ material.title }}" required>
            </div>

            <!-- DESCRIPTION -->
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="4">{{ material.description }}</textarea>
            </div>

            <!-- FILE -->
            <div class="form-group">
                <label>Upload File</label>
                <div class="file-box">
                    <input type="file" name="file">

                    {% if material.file %}
                        <div class="file-name">
                            Current File: {{ material.file.name }}
                        </div>
                    {% endif %}
                </div>
            </div>

            <!-- BUTTONS -->
            <div class="actions">
                <button type="submit" class="btn update">Update</button>
                <a href="{% url 'material_list' %}" class="btn cancel">Cancel</a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
