{% extends "base_dashboard.html" %}
{% block content %}

<div class="card" style="max-width:400px;margin:auto;padding:30px;text-align:center;">
    <h3>Are you sure?</h3>
    <p>Delete <b>{{ program.title }}</b> program?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn" style="background:red;">Yes, Delete</button>
    </form>

    <br>
    <a href="{% url 'training_programs' %}">Cancel</a>
</div>

{% endblock %}
