<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TMS | Careers</title>

<style>
body{
    margin:0;
    font-family:Poppins;
    background:linear-gradient(135deg,#38bdf8,#0ea5e9);
    color:white;
    text-align:center;
}

h1{
    margin-top:30px;
    animation:fadeIn 1.5s ease;
}

.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:30px;
}

.job{
    background:white;
    color:black;
    margin:15px;
    border-radius:15px;
    width:270px;
    overflow:hidden;
    transition:0.4s;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.job img{
    width:100%;
    height:160px;
    object-fit:cover;
}

.job-content{
    padding:15px;
}

.job:hover{
    transform:translateY(-10px) scale(1.05);
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>
<body>

<h1>💼 Careers at TMS</h1>

<div class="container">

<div class="job">
    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085">
    <div class="job-content">
        <h3>Frontend Developer</h3>
        <p>HTML, CSS, JavaScript, UI/UX skills</p>
    </div>
</div>

<div class="job">
    <img src="https://images.unsplash.com/photo-1555949963-aa79dcee981c">
    <div class="job-content">
        <h3>Backend Developer</h3>
        <p>Python / Django / APIs</p>
    </div>
</div>

<div class="job">
    <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71">
    <div class="job-content">
        <h3>Data Analyst</h3>
        <p>SQL, Excel, Power BI</p>
    </div>
</div>

<div class="job">
    <img src="https://images.unsplash.com/photo-1545239351-1141bd82e8a6">
    <div class="job-content">
        <h3>UI/UX Designer</h3>
        <p>Figma, Adobe XD, Creativity</p>
    </div>
</div>

<div class="job">
    <img src="https://images.unsplash.com/photo-1510511459019-5dda7724fd87">
    <div class="job-content">
        <h3>Cyber Security</h3>
        <p>Network security & ethical hacking</p>
    </div>
</div>

<div class="job">
    <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995">
    <div class="job-content">
        <h3>AI Engineer</h3>
        <p>Machine Learning & AI tools</p>
    </div>
</div>

</div>

</body>
</html>
