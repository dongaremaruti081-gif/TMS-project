<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TMS | Careers</title>

<style>

body{
    margin:0;
    font-family:Poppins;
    background:linear-gradient(135deg,#38bdf8,#0ea5e9);
    color:white;
    text-align:center;
}

/* TITLE */
h1{
    margin-top:30px;
    animation:fadeIn 1.5s ease;
}

/* CONTAINER */
.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:30px;
}

/* JOB CARD */
.job{
    background:white;
    color:black;
    margin:15px;
    border-radius:15px;
    width:270px;
    overflow:hidden;
    transition:0.4s;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* IMAGE */
.job img{
    width:100%;
    height:160px;
    object-fit:cover;
}

/* CONTENT */
.job-content{
    padding:15px;
}

.job:hover{
    transform:translateY(-10px) scale(1.05);
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

/* BUTTON */
.btn{
    margin-top:10px;
    padding:10px 20px;
    background:#0ea5e9;
    border:none;
    color:white;
    border-radius:20px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#0284c7;
    transform:scale(1.1);
}

/* ANIMATION */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<h1>💼 Careers at TMS</h1>

<div class="container">

<!-- FRONTEND -->
<div class="job">
<img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085">
<div class="job-content">
<h3>Frontend Developer</h3>
<p>HTML, CSS, JavaScript, UI/UX skills</p>
<button class="btn" onclick="applyJob('Frontend Developer')">Apply</button>
</div>
</div>

<!-- BACKEND -->
<div class="job">
<img src="https://images.unsplash.com/photo-1555949963-aa79dcee981c">
<div class="job-content">
<h3>Backend Developer</h3>
<p>Python / Django / APIs</p>
<button class="btn" onclick="applyJob('Backend Developer')">Apply</button>
</div>
</div>

<!-- DATA ANALYST -->
<div class="job">
<img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71">
<div class="job-content">
<h3>Data Analyst</h3>
<p>SQL, Excel, Power BI</p>
<button class="btn" onclick="applyJob('Data Analyst')">Apply</button>
</div>
</div>

<!-- UI DESIGNER -->
<div class="job">
<img src="https://images.unsplash.com/photo-1545239351-1141bd82e8a6">
<div class="job-content">
<h3>UI/UX Designer</h3>
<p>Figma, Adobe XD, Creativity</p>
<button class="btn" onclick="applyJob('UI Designer')">Apply</button>
</div>
</div>

<!-- CYBER SECURITY -->
<div class="job">
<img src="https://images.unsplash.com/photo-1510511459019-5dda7724fd87">
<div class="job-content">
<h3>Cyber Security</h3>
<p>Network security & ethical hacking</p>
<button class="btn" onclick="applyJob('Cyber Security')">Apply</button>
</div>
</div>

<!-- AI ENGINEER -->
<div class="job">
<img src="https://images.unsplash.com/photo-1677442136019-21780ecad995">
<div class="job-content">
<h3>AI Engineer</h3>
<p>Machine Learning & AI tools</p>
<button class="btn" onclick="applyJob('AI Engineer')">Apply</button>
</div>
</div>

</div>

<!-- JS -->
<script>
function applyJob(role){
    alert("You applied for " + role + " 🚀");
}
</script>

</body>
</html>
