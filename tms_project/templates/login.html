{% extends 'base.html' %}

{% block content %}

<style>
    .login-container {
        width: 350px;
        margin: 80px auto;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.2);
        text-align: center;
        background: white;
    }

    .login-container h2 {
        margin-bottom: 20px;
    }

    .login-container input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    .login-container button {
        width: 95%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .login-container button:hover {
        background: #0056b3;
    }

    .error {
        color: red;
        margin-top: 10px;
    }

    .label {
        display: block;
        text-align: left;
        margin-left: 5%;
        font-size: 14px;
        font-weight: 500;
    }
</style>

<div class="login-container">
    <h2>Login</h2>

    <form method="POST">
        {% csrf_token %}

        <label class="label">Username</label>
        <input type="text" name="username" placeholder="Username" required>

        <label class="label">Password</label>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p class="error">{{ error }}</p>

    <p>Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </p>
</div>

{% endblock %}
