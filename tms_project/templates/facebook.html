<!DOCTYPE html>
<html>
<head>
<title>TMS | Facebook</title>

<style>
body{
  margin:0;
  font-family:Poppins;
  background:linear-gradient(135deg,#1877f2,#0d5bd3);
  color:white;
  text-align:center;
}

.container{
  margin-top:100px;
}

/* BUTTON */
.btn{
  margin:15px;
  padding:12px 25px;
  background:white;
  border-radius:25px;
  display:inline-block;
  transition:0.3s;
}

.btn:hover{
  transform:scale(1.1);
}

/* LINK */
.btn a{
  text-decoration:none;
  color:black;
  font-weight:bold;
}
</style>

</head>

<body>

<div class="container">
<h1>📘 Facebook Page</h1>
<p>Follow Greentin Solutions Pvt Ltd on Facebook</p>

<!-- ✅ DIRECT LINK -->
<div class="btn">
  <a href="https://www.facebook.com/search/top/?q=Greentin%20Solutions%20Pvt%20Ltd" target="_blank">
    Open Greentin Facebook
  </a>
</div>
<!-- ✅ SEARCH FALLBACK -->
<div class="btn">
  <a href="https://www.facebook.com/search/top/?q=Greentin%20Solutions%20Pvt%20Ltd" target="_blank">
    Search Greentin Facebook
  </a>
</div>

</div>

</body>
</html>
